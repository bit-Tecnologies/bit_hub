name: Release

# Только ручной запуск: Actions -> Release -> Run workflow.
# tag — тег релиза (напр. v0.0.2.8); он должен совпадать с appVersionName в app/build.gradle.kts.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Тег релиза (напр. v0.0.2.8)"
        required: true
        type: string
      notes:
        description: "Описание релиза (пусто = сгенерировать автоматически)"
        required: false
        type: string
      prerelease:
        description: "Пометить как pre-release"
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: release-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Check tag matches appVersionName
        env:
          TAG: ${{ inputs.tag }}
        run: |
          NAME=$(grep -oP 'val appVersionName = "\K[^"]+' app/build.gradle.kts)
          CODE=$(grep -oP 'val appVersionCode = \K[0-9]+' app/build.gradle.kts)
          if [ "v$NAME" != "$TAG" ]; then
            echo "::error::Тег $TAG не совпадает с appVersionName v$NAME в app/build.gradle.kts"
            exit 1
          fi
          echo "VERSION_NAME=$NAME" >> "$GITHUB_ENV"
          echo "VERSION_CODE=$CODE" >> "$GITHUB_ENV"

      - name: Fail if release already exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "::error::Релиз $TAG уже существует"
            exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Write secrets.properties
        # Файл в .gitignore; значения берутся из Settings -> Secrets and variables -> Actions.
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_KEY" ]; then
            echo "::error::Секреты SUPABASE_URL / SUPABASE_KEY не заданы"
            exit 1
          fi
          {
            echo "SUPABASE_URL=$SUPABASE_URL"
            echo "SUPABASE_KEY=$SUPABASE_KEY"
          } > secrets.properties

      - name: Build release APK
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Sign APK
        # Без подписи Android отвечает «пакет недействителен» при установке.
        # Подписываем ключом из секретов ANDROID_KEYSTORE_*; без них шаг падает.
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          OUT=app/build/outputs/apk/release
          APK_IN=$(ls "$OUT"/*-release-unsigned.apk "$OUT"/*-release.apk 2>/dev/null | head -1)
          if [ -z "$APK_IN" ]; then
            echo "::error::APK не найден в $OUT"
            exit 1
          fi
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::Секреты ANDROID_KEYSTORE_* не заданы — без подписи APK не установится"
            exit 1
          fi
          BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
          FINAL="bithub-${VERSION_CODE}-v${VERSION_NAME}-release.apk"
          "$BT/zipalign" -f -p 4 "$APK_IN" "$RUNNER_TEMP/aligned.apk"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          "$BT/apksigner" sign \
            --ks "$RUNNER_TEMP/release.jks" \
            --ks-key-alias "$ANDROID_KEY_ALIAS" \
            --ks-pass env:ANDROID_KEYSTORE_PASSWORD \
            --out "$FINAL" "$RUNNER_TEMP/aligned.apk"
          "$BT/apksigner" verify --print-certs "$FINAL"
          rm -f "$RUNNER_TEMP/release.jks" "$RUNNER_TEMP/aligned.apk"
          echo "APK_FILE=$FINAL" >> "$GITHUB_ENV"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ inputs.tag }}
          NOTES: ${{ inputs.notes }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          ARGS=(--target "$GITHUB_SHA" --title "v${VERSION_NAME} (${VERSION_CODE})")
          if [ "$PRERELEASE" = "true" ]; then ARGS+=(--prerelease); fi
          if [ -n "$NOTES" ]; then
            ARGS+=(--notes "$NOTES")
          else
            ARGS+=(--generate-notes)
          fi
          gh release create "$TAG" "$APK_FILE" "${ARGS[@]}"
