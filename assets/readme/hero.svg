<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="400" viewBox="0 0 1200 400" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="400" fill="#0F172A"/>

  <!-- Soft background accents -->
  <defs>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="40" result="blurred"/>
      <feMerge>
        <feMergeNode in="blurred"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#softGlow)">
    <circle cx="600" cy="160" r="140" fill="#2C6CFF" fill-opacity="0.08"/>
    <circle cx="860" cy="80" r="80" fill="#06B6D4" fill-opacity="0.04"/>
  </g>

  <!-- Simple icon circle -->
  <g transform="translate(520,60)">
    <circle cx="80" cy="80" r="60" fill="#2C6CFF" />
    <g transform="translate(50,50) scale(0.6)" fill="#fff" opacity="0.98">
      <!-- simplified app glyph for consistency -->
      <rect x="6" y="6" width="28" height="28" rx="6" fill="#fff" opacity="0.06"/>
      <path d="M20 10c-3 0-5 2-5 5s2 5 5 5 5-2 5-5-2-5-5-5zm0 2c1.6 0 3 1.4 3 3s-1.4 3-3 3-3-1.4-3-3 1.4-3 3-3z" fill="#fff" />
    </g>
  </g>

  <!-- Title: softened font -->
  <text x="600" y="260" text-anchor="middle" fill="#FFFFFF"
        style="font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 700; font-size: 64px; letter-spacing: -0.5px;">
    bit Hub
  </text>

  <!-- Subtitle: matching softer family -->
  <text x="600" y="305" text-anchor="middle" fill="#94A3B8"
        style="font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif; font-weight: 500; font-size: 18px; letter-spacing: 0.6px; text-transform: none;">
    Smart Android Distribution & App Store
  </text>

  <!-- Bottom Accent Line -->
  <rect x="520" y="330" width="160" height="4" rx="2" fill="#2C6CFF"/>
</svg>
