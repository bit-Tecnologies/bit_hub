<svg xmlns="http://www.w3.org/2000/svg" width="270" height="84" viewBox="0 0 270 84">
  <rect width="270" height="84" rx="12" ry="12" fill="#1a1a1a" stroke="#333" stroke-width="1"/>
  <!-- Cat mascot (Obtainium-style) -->
  <g transform="translate(14, 12)">
    <!-- Ears -->
    <polygon points="8,14 16,0 22,14" fill="#6c63ff"/>
    <polygon points="34,14 42,0 48,14" fill="#6c63ff"/>
    <polygon points="11,14 16,4 19,14" fill="#1a1a1a"/>
    <polygon points="37,14 42,4 45,14" fill="#1a1a1a"/>
    <!-- Head -->
    <ellipse cx="28" cy="32" rx="23" ry="20" fill="#6c63ff"/>
    <!-- Eyes -->
    <ellipse cx="18" cy="28" rx="5" ry="5.5" fill="#fff"/>
    <ellipse cx="38" cy="28" rx="5" ry="5.5" fill="#fff"/>
    <circle cx="19.5" cy="28.5" r="2.8" fill="#111"/>
    <circle cx="39.5" cy="28.5" r="2.8" fill="#111"/>
    <circle cx="20.5" cy="27.5" r="1" fill="#fff"/>
    <circle cx="40.5" cy="27.5" r="1" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="28" cy="35" rx="2.5" ry="1.8" fill="#ff8fab"/>
    <!-- Mouth -->
    <path d="M24 37.5 Q28 42 32 37.5" fill="none" stroke="#fff" stroke-width="1.3" stroke-linecap="round"/>
    <line x1="28" y1="37" x2="28" y2="40" stroke="#fff" stroke-width="1.1" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="2" y1="32" x2="12" y2="34" stroke="#fff" stroke-width="0.8" opacity="0.5"/>
    <line x1="2" y1="36" x2="12" y2="36" stroke="#fff" stroke-width="0.8" opacity="0.5"/>
    <line x1="44" y1="34" x2="54" y2="32" stroke="#fff" stroke-width="0.8" opacity="0.5"/>
    <line x1="44" y1="36" x2="54" y2="36" stroke="#fff" stroke-width="0.8" opacity="0.5"/>
  </g>
  <!-- Text -->
  <text x="78" y="32" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#999" letter-spacing="0.5">GET IT ON</text>
  <text x="78" y="56" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="700" fill="#fff" letter-spacing="0.5">GitHub Store</text>
</svg>
