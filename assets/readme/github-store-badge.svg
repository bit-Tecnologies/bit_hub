<svg xmlns="http://www.w3.org/2000/svg" width="270" height="84" viewBox="0 0 270 84">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1a1a2e"/>
      <stop offset="100%" stop-color="#16213e"/>
    </linearGradient>
  </defs>
  <rect width="270" height="84" rx="14" ry="14" fill="url(#bg)" stroke="#333" stroke-width="1"/>
  <!-- Cat icon (Obtainium-style) -->
  <g transform="translate(16, 10)">
    <!-- Ears -->
    <polygon points="6,12 12,0 18,12" fill="#6c63ff"/>
    <polygon points="28,12 34,0 40,12" fill="#6c63ff"/>
    <polygon points="9,12 12,4 15,12" fill="#1a1a2e"/>
    <polygon points="31,12 34,4 37,12" fill="#1a1a2e"/>
    <!-- Head -->
    <ellipse cx="23" cy="28" rx="19" ry="17" fill="#6c63ff"/>
    <!-- Eyes -->
    <ellipse cx="15" cy="25" rx="4" ry="4.5" fill="#fff"/>
    <ellipse cx="31" cy="25" rx="4" ry="4.5" fill="#fff"/>
    <circle cx="16" cy="25.5" r="2.2" fill="#111"/>
    <circle cx="32" cy="25.5" r="2.2" fill="#111"/>
    <circle cx="16.8" cy="24.5" r="0.8" fill="#fff"/>
    <circle cx="32.8" cy="24.5" r="0.8" fill="#fff"/>
    <!-- Nose -->
    <ellipse cx="23" cy="31" rx="2" ry="1.5" fill="#ff8fab"/>
    <!-- Mouth -->
    <path d="M20 33 Q23 37 26 33" fill="none" stroke="#fff" stroke-width="1.2" stroke-linecap="round"/>
    <line x1="23" y1="32.5" x2="23" y2="35" stroke="#fff" stroke-width="1" stroke-linecap="round"/>
    <!-- Whiskers -->
    <line x1="2" y1="28" x2="10" y2="30" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
    <line x1="2" y1="32" x2="10" y2="32" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
    <line x1="36" y1="30" x2="44" y2="28" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
    <line x1="36" y1="32" x2="44" y2="32" stroke="#fff" stroke-width="0.8" opacity="0.6"/>
  </g>
  <!-- Text -->
  <text x="72" y="32" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#ccc" letter-spacing="0.5">GET IT ON</text>
  <text x="72" y="56" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#fff" letter-spacing="0.5">GitHub Store</text>
</svg>
